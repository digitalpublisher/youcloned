# Runs the PC pieces on GitHub's own Windows computers, since no Windows PC of ours tests them yet (#30).
# It covers what a script can prove: the installer, the dashboard server, the add-on tests. The live mic,
# Zoom and Slack checks still need a person at a Windows PC.
name: Windows PC

on:
  pull_request:
    paths: ["install/**", "youcloned/**", ".github/workflows/windows-pc.yml"]
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Windows PowerShell 5.1 is what a buyer has, so the installer runs there, not in pwsh.
      - name: First run installs what is missing
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install\windows-command.ps1 *>&1 | Tee-Object first.txt
          if ($LASTEXITCODE -ne 0) { throw "installer exit $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $HOME "YouCloned"))) { throw "no YouCloned folder" }
      - name: Second run skips every tool
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install\windows-command.ps1 *>&1 | Tee-Object second.txt
          if ($LASTEXITCODE -ne 0) { throw "installer exit $LASTEXITCODE" }
          $skips = (Select-String -Path second.txt -Pattern "already installed. Skipping").Count
          if ($skips -ne 7) { throw "second run skipped $skips of 7 tools" }

  dashboard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dashboard server answers on a PC
        shell: powershell
        run: |
          $p = Start-Process python -ArgumentList "youcloned\dashboard\server.py", "4600" -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..20) {
            try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4600/).StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep 1 }
          }
          Stop-Process $p.Id
          if (-not $ok) { throw "dashboard did not answer on port 4600" }

  addon-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Add-on tests on a PC
        shell: pwsh
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin test ./youcloned
